global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'ingestion-service'
    static_configs:
      - targets: ['host.docker.internal:8000'] 
    # Note: host.docker.internal works on Mac/Windows. For Linux, might need specific network config or use IP.
    # We will assume for now this runs locally or we fix with --add-host.
